name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Monday at 03:00 UTC, so newly disclosed CVEs are caught even without a
    # code change.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          queries: security-extended

      - name: Build (for CodeQL analysis)
        run: mvn -B clean compile -DskipTests

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # The NVD API has required a registered API key for reliable access since 2024; without one,
      # requests are frequently rejected (HTTP 403) and this step fails outright before it can
      # write any report. Get a free key at https://nvd.nist.gov/developers/request-an-api-key
      # and add it as the repository secret NVD_API_KEY (Settings > Secrets and variables >
      # Actions) to enable full OWASP dependency scanning. `continue-on-error` and the `if`
      # guards below keep that external, quota-driven failure from blocking CodeQL and gitleaks,
      # which are this workflow's other, always-on security signals.
      - name: Run OWASP Dependency-Check
        id: dependency-check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # `formats` (plural) explicitly requests both reports; pom.xml's <format>ALL</format> is
        # the fallback default for other invocations (e.g. a local `mvn dependency-check:check`).
        run: mvn -B org.owasp:dependency-check-maven:check -DnvdApiKey="${NVD_API_KEY}" -Dformats=HTML,SARIF

      - name: Upload SARIF report to GitHub Security tab
        if: always() && hashFiles('target/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: target/dependency-check-report.sarif

      - name: Upload Dependency-Check report
        if: always() && hashFiles('target/dependency-check-report.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

      - name: Fail if Dependency-Check found vulnerabilities (not just an NVD update failure)
        if: steps.dependency-check.outcome == 'failure' && hashFiles('target/dependency-check-report.html') != ''
        run: |
          echo "::error::Dependency-Check completed but reported vulnerabilities above the configured CVSS threshold."
          exit 1
          retention-days: 14

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
